[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eristem-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "PyMuPDF>=1.24,<2", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
