services:
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://eristem:eristem@db:5432/eristem
      OBJECT_STORAGE_BACKEND: local
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./apps/web
    ports: ["5173:80"]
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eristem
      POSTGRES_USER: eristem
      POSTGRES_PASSWORD: eristem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eristem -d eristem"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:
