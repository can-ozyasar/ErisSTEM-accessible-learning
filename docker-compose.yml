services:
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://eristem:eristem@db:5432/eristem
      OBJECT_STORAGE_BACKEND: local
      DERIVED_ROOT: /private/derived
      LOCAL_TTS_URL: http://tts:5000/synthesize
    volumes:
      - ./data/derived:/private/derived:ro
      - ./data/meb:/private/meb:ro
      - ./data/soru_bankasi:/private/question-bank:ro
    depends_on:
      db:
        condition: service_healthy
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s
    networks: [internal]
  tts:
    build: ./apps/tts
    # No host port: source text and synthesized audio remain in the local
    # Docker network.  This CPU profile works on machines without a GPU.
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/info', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 15s
    networks: [internal]
  worker:
    build: ./apps/api
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["python", "-m", "app.pipeline.queue_worker", "--source-root", "/private/meb", "--output-dir", "/private/derived"]
    environment:
      DATABASE_URL: postgresql+psycopg://eristem:eristem@db:5432/eristem
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/meb:/private/meb:ro
      - ./data/derived:/private/derived
      - ./data/private:/private/private
    mem_limit: 1g
    cpus: 1.0
    networks: [internal]
  web:
    build: ./apps/web
    # Development X-Role headers are not authentication; do not expose private
    # review routes and MEB-derived content on the LAN.
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api:
        condition: service_healthy
        # Nginx resolves an upstream name when it starts.  Restart it whenever
        # Compose explicitly recreates API, so it cannot retain an old IP.
        restart: true
    networks: [internal, edge]
  exam-maintenance:
    build: ./apps/api
    command: ["python", "-m", "app.exam_maintenance", "--watch"]
    environment:
      DATABASE_URL: postgresql+psycopg://eristem:eristem@db:5432/eristem
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eristem
      POSTGRES_USER: eristem
      POSTGRES_PASSWORD: eristem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eristem -d eristem"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [internal]
volumes:
  postgres_data:
networks:
  internal:
    internal: true
  edge: {}
