services:
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://eristem:eristem@db:5432/eristem
      OBJECT_STORAGE_BACKEND: local
      DERIVED_ROOT: /private/derived
      LOCAL_TTS_URL: http://tts:5000/synthesize
      LOCAL_TTS_CACHE_ROOT: /private/tts-cache
      LOCAL_TTS_DEMO_ROOT: /private/tts-v5-demo
      LOCAL_TTS_DEMO_EXTRA_ROOT: /private/tts-v5-extra/installed
      # Content-free AYT 10--12 architecture summary.  The endpoint exposes
      # only counts/checksums; the private corpus itself never reaches web.
      HISTORY_ARCHITECTURE_SNAPSHOT: /private/architecture/history-architecture-snapshot-v1.json
      # Offline experiment summaries. They never enable external APIs in the
      # student runtime and contain no source prose, question, answer or key.
      HISTORY_GRAPH_PREFILL_REPORT: /private/architecture/ayt-graph-prefill-report-priority-v1.json
      HISTORY_EXTERNAL_EVIDENCE_EVALUATION: /private/architecture/deepseek-evidence-judge-pilot-v1.json
      HISTORY_SOURCE_RELATION_PROPOSALS: /private/architecture/deepseek-source-relation-expanded-v1.json
      # Set only with the gpu profile. Without this endpoint the API uses its
      # answer-key-isolated deterministic coaching fallback.
      LOCAL_TUTOR_LLM_URL: ${LOCAL_TUTOR_LLM_URL:-}
      # Optional AYT graph runtime. Empty by default: the route fails closed
      # until a teacher-approved private graph is mounted.
      AYT_APPROVED_GRAPH_PATH: ${AYT_APPROVED_GRAPH_PATH:-/private/architecture/ayt-target-approved-graph-v1.json}
      AYT_GRAPH_CHECKSUM: ${AYT_GRAPH_CHECKSUM:-}
      AYT_TTS_CACHE_ROOT: /private/tts-cache
      AYT_TTS_VOICE_VERSION: ${AYT_TTS_VOICE_VERSION:-tts-v5}
      # Optional, teacher-approved authored AYT history package.  When set,
      # the API rejects incomplete or unreviewed manifests rather than mixing
      # private material with the synthetic accessibility rehearsal.
      # 81-question local pilot: 63 license-bound questions plus 18 questions
      # accepted by the recorded AI source-consensus gate. The manifest keeps
      # this distinct from a human-teacher approval claim.
      AYT_HISTORY_EXAM_PACK: ${AYT_HISTORY_EXAM_PACK:-/private/ayt-history-exam/ogm-ai-reviewed-local-pilot-v1.json}
      AYT_HISTORY_SOURCE_ROOT: /private/meb
      # Local-only source-crop review for the 19 Qwen dense retrieval candidates.
      # It stays outside the student exam pack until a project-owner PDF review
      # records an explicit decision for every item.
      OGM_AYT_EVIDENCE_REVIEW_ROOT: ${OGM_AYT_EVIDENCE_REVIEW_ROOT:-/private/architecture/ogm-ayt-abstained-qwen-dense-pdf-review-v1}
    volumes:
      - ./data/derived:/private/derived:ro
      - ./data/meb:/private/meb:ro
      - ./data/soru_bankasi:/private/question-bank:ro
      - ./data/private/tts-v5-demo-installed-v1:/private/tts-v5-demo:ro
      - ./data/private/tts-v5-extra-storage:/private/tts-v5-extra:ro
      - ./data/private/yks-ayt-source-v1:/private/architecture:ro
      - ./data/private/ayt-history-exam:/private/ayt-history-exam:ro
      - tts_audio_cache:/private/tts-cache
    depends_on:
      db:
        condition: service_healthy
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s
    networks: [internal]
  tts:
    build: ./apps/tts
    # No host port: source text and synthesized audio remain in the local
    # Docker network.  This CPU profile works on machines without a GPU.
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/info', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 15s
    networks: [internal]
  tutor-llm:
    profiles: ["gpu"]
    build: ./apps/tutor_llm
    environment:
      TUTOR_MODEL_MANIFEST: /models/manifest.json
    volumes:
      - ./data/private/tutor-models/qwen3-14b-v1:/models:ro
    gpus: all
    networks: [internal]
  worker:
    build: ./apps/api
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["python", "-m", "app.pipeline.queue_worker", "--source-root", "/private/meb", "--output-dir", "/private/derived"]
    environment:
      DATABASE_URL: postgresql+psycopg://eristem:eristem@db:5432/eristem
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/meb:/private/meb:ro
      - ./data/derived:/private/derived
      - ./data/private:/private/private
    mem_limit: 1g
    cpus: 1.0
    networks: [internal]
  web:
    build: ./apps/web
    # Development X-Role headers are not authentication; do not expose private
    # review routes and MEB-derived content on the LAN.
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api:
        condition: service_healthy
        # Nginx resolves an upstream name when it starts.  Restart it whenever
        # Compose explicitly recreates API, so it cannot retain an old IP.
        restart: true
    networks: [internal, edge]
  exam-maintenance:
    build: ./apps/api
    command: ["python", "-m", "app.exam_maintenance", "--watch"]
    environment:
      DATABASE_URL: postgresql+psycopg://eristem:eristem@db:5432/eristem
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eristem
      POSTGRES_USER: eristem
      POSTGRES_PASSWORD: eristem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eristem -d eristem"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [internal]
volumes:
  postgres_data:
  tts_audio_cache:
networks:
  internal:
    internal: true
  edge: {}
